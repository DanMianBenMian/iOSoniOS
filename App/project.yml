name: iOSoniOS
options:
  bundleIdPrefix: com.rybox
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_NAME: iOSoniOS
    SWIFT_VERSION: "5.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    INFOPLIST_FILE: Sources/Info.plist
    GENERATE_INFOPLIST_FILE: NO
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_OBJC_BRIDGING_HEADER: "Sources/iOSoniOS-Bridging-Header.h"
    ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/../Henge-main/core"
      - "$(SRCROOT)/../Henge-main/host"
      - "$(SRCROOT)/../Henge-main/devices"
      - "$(SRCROOT)/Sources/C"
    OTHER_LDFLAGS:
      - "$(inherited)"
      - "-lz"

targets:
  iOSoniOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Info.plist"
          - "iOSoniOS.entitlements"
      - path: Assets.xcassets
        buildPhase: resources
      # Henge's arm64 translation engine. core/ is self-contained (no devices/
      # needed): translator, software MMU, exception handling, dispatcher.
      - path: ../Henge-main/core
        includes:
          - "*.c"
      - path: ../Henge-main/host/jit_region.c
    entitlements:
      path: Sources/iOSoniOS.entitlements
    dependencies: []
